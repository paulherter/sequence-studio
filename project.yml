name: SequenceStudio
options:
  bundleIdPrefix: de.paulherter
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  SQCore: { path: Packages/SQCore }
  SQMedia: { path: Packages/SQMedia }
  SQRender: { path: Packages/SQRender }
  SQPlayback: { path: Packages/SQPlayback }
  SQAudioFX: { path: Packages/SQAudioFX }
  SQExport: { path: Packages/SQExport }
  SQTranscribe: { path: Packages/SQTranscribe }
  SQAnalysis: { path: Packages/SQAnalysis }
  SQEditorUI: { path: Packages/SQEditorUI }
  SQLibrary: { path: Packages/SQLibrary }
  SQPremiereImport: { path: Packages/SQPremiereImport }
  SQEditAPI: { path: Packages/SQEditAPI }
  SQFrame: { path: Packages/SQFrame }
  SQDrawKit: { path: Packages/SQDrawKit }
  SQDrawShell: { path: Packages/SQDrawShell }
  SQDrawTimeline: { path: Packages/SQDrawTimeline }
  SQEditorSession: { path: Packages/SQEditorSession }
  SQAppShell: { path: Packages/SQAppShell }
  SQDrawMonitor: { path: Packages/SQDrawMonitor }
targets:
  SequenceStudio:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/AppIcon.icon
      - path: App/Resources
        buildPhase: resources
      - path: SUPPORTERS.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Sequence Studio
        CFBundleDisplayName: Sequence Studio
        NSMicrophoneUsageDescription: Sequence Studio records your voice-over from the microphone onto the timeline. Nothing is recorded until you start a voice-over.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sequence Studio Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [de.paulherter.sequencestudio.project]
          - CFBundleTypeName: Sequence Studio Project (legacy)
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSTypeIsPackage: true
            LSItemContentTypes: [de.paulherter.sequencestudio.project-legacy]
          - CFBundleTypeName: Sequence Studio Preset Pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [de.paulherter.sequencestudio.pack]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.paulherter.sequencestudio.pack
            UTTypeDescription: Sequence Studio Preset Pack
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sqpack]
          - UTTypeIdentifier: de.paulherter.sequencestudio.project
            UTTypeDescription: Sequence Studio Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [sqproj]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: de.paulherter.sequencestudio.project-legacy
            UTTypeDescription: Sequence Studio Project (legacy)
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [ssproj]
    dependencies:
      - package: SQCore
      - package: SQMedia
      - package: SQRender
      - package: SQPlayback
      - package: SQAudioFX
      - package: SQExport
      - package: SQTranscribe
      - package: SQAnalysis
      - package: SQEditorUI
      - package: SQLibrary
      - package: SQPremiereImport
      - package: SQEditAPI
      - package: SQFrame
        product: SQFrame
      # The opt-in shared draw-list UI (SQ_SHARED_UI=1, App/Sources/SharedUI).
      - package: SQDrawKit
        product: SQDrawKit
      - package: SQDrawKit
        product: SQDrawEditor
      - package: SQDrawShell
      - package: SQDrawTimeline
      - package: SQEditorSession
      - package: SQAppShell
      - package: SQDrawMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.paulherter.SequenceStudio
        PRODUCT_NAME: Sequence Studio
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_MODULE_NAME: SequenceStudio
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # The Gyroflow engine's library is copied in by the script below (not linked): it may be missing.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Gyroflow engine (libsqgyro.dylib)
        basedOnDependencyAnalysis: false
        script: |
          # Built by scripts/build-gyro.sh (Rust, gyroflow_core). Missing = the Gyroflow method shows "not installed".
          LIB="$SRCROOT/build/gyro/libsqgyro.dylib"
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          if [ -f "$LIB" ]; then
            mkdir -p "$DEST"
            cp -f "$LIB" "$DEST/libsqgyro.dylib"
            codesign --force -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/libsqgyro.dylib"
          else
            rm -f "$DEST/libsqgyro.dylib"
          fi
