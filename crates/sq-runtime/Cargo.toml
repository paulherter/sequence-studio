[package]
name = "sq-runtime"
description = "Single-threaded UI executor, worker pool, modal asks, channels and the UI root handle (std only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Workspace lints repeated (a crate cannot extend them); the last two are the async-safety lints of this crate.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
