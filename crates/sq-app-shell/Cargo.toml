[package]
name = "sq-app-shell"
description = "The app root: App (port of AppController), the platform traits and the headless frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sq-core-time.workspace = true
sq-core-model.workspace = true
sq-uikit.workspace = true
sq-audiofx.workspace = true
accesskit.workspace = true
sq-draw.workspace = true
sq-draw-shell.workspace = true
sq-runtime.workspace = true
sq-editor-session.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Workspace lints repeated (a crate cannot extend them) plus the async-safety lints of sq-runtime: flows that reach the
# app through `UiRef` must never hold a root borrow across an await.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
