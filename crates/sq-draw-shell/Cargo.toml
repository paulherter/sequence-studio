[package]
name = "sq-draw-shell"
description = "The shell of the shared draw UI: menu bar and menus, dialogs, key routing and the host that owns them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sq-core-time.workspace = true
sq-core-model.workspace = true
sq-core-color.workspace = true
sq-core-effects.workspace = true
sq-core-project.workspace = true
sq-core-file.workspace = true
sq-core-edit.workspace = true
sq-uikit.workspace = true
sq-draw.workspace = true
sq-runtime.workspace = true
sq-editor-session.workspace = true
sq-library.workspace = true
sq-media.workspace = true
sq-core-audio.workspace = true
sq-premiere-import.workspace = true
sq-export.workspace = true
sq-transcribe.workspace = true
sq-core-masks.workspace = true
chrono.workspace = true
serde_json.workspace = true
sq-os.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Workspace lints repeated (a crate cannot extend them) plus the async-safety lints of sq-runtime: flows that reach the
# app through `UiRef` must never hold a root borrow across an await.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"

[dev-dependencies]
sq-frame.workspace = true
