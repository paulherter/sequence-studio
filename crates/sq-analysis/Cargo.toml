[package]
name = "sq-analysis"
description = "Analysis: stabilization, mattes, magic mask, subject tracking, benchmarks (portable engines)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
sq-core-time.workspace = true
sq-core-model.workspace = true
sq-core-masks.workspace = true
sq-core-effects.workspace = true
sq-media.workspace = true
sq-onnx.workspace = true
sq-frame.workspace = true
serde.workspace = true
serde_json.workspace = true
sq-os.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
cc.workspace = true

# Same lints as the workspace, except unsafe code: it is denied here and allowed only in the `lzfse` module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
