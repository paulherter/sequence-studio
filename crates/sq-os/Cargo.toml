[package]
name = "sq-os"
description = "The one place that names the system the app runs on (Mac, Windows, Linux) and what differs between them: key names, folders, file manager, update asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Workspace lints repeated: this crate is on the unsafe allow-list (thread QoS / priority and thread CPU time, `thread.rs`).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
