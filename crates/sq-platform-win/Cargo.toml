[package]
name = "sq-platform-win"
description = "Windows-only window services of the app: the borderless window chrome (hit test, maximize button)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
winit.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
sq-fault-text.workspace = true
sq-os.workspace = true
sq-library.workspace = true

# Workspace lints repeated: this crate is on the unsafe allow-list (Win32 window subclass).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
