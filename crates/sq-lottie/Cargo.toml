[package]
name = "sq-lottie"
description = "Lottie document model and renderer seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sq-core-time.workspace = true
sq-core-model.workspace = true
sq-core-effects.workspace = true
sq-core-graphics.workspace = true
sq-frame.workspace = true
sq-text.workspace = true
png.workspace = true
zune-jpeg = "0.5" # JPEG image assets, like ThorVG's JPG loader (MIT/Apache-2.0/Zlib)
serde.workspace = true
serde_json.workspace = true
# BSD-3-Clause, pure Rust software rasterizer (already in Cargo.lock); no png feature.
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
jpeg-encoder.workspace = true

[lints]
workspace = true
