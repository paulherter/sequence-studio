[package]
name = "sq-gpu"
description = "GPU device layer on wgpu: shader build outputs, fixed binding layout, pipelines, frames, readback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sq-core-time.workspace = true
sq-frame.workspace = true
sq-os.workspace = true
wgpu.workspace = true
pollster.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json.workspace = true

# Passthrough shader modules are `unsafe` to create (wgpu skips validation): one module, pipelines/passthrough.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
