[package]
name = "sq-audiofx"
description = "Own audio DSP: effects, loudness, pitch, noise reduction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
sq-core-time.workspace = true
sq-core-model.workspace = true
sq-core-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
cc.workspace = true

# Same lints as the workspace, except that the one `ffi` module may use `unsafe` (RNNoise C library).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
